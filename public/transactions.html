<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentPay · Transactions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E16; --panel:#0E1420; --border:#1C2534; --text:#E8EAED;
    --muted:#8B93A0; --blue:#378ADD; --green:#22C55E; --red:#EF4444;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;padding:40px 24px;}
  .wrap{max-width:900px;margin:0 auto;}
  nav{display:flex;gap:18px;margin-bottom:28px;font-family:'JetBrains Mono',monospace;font-size:12px;flex-wrap:wrap;}
  nav a{color:var(--muted);text-decoration:none;}
  nav a.active{color:var(--text);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);letter-spacing:.08em;margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0 0 12px;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:500;padding:10px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;}
  .status-pill{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:100px;}
  .status-pill.released{color:var(--green);background:rgba(34,197,94,.1);}
  .status-pill.refunded{color:var(--red);background:rgba(239,68,68,.1);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0;}

  .wrap{padding-left:calc(190px + 40px) !important;}
  .sidebar{position:fixed;top:0;left:0;width:190px;height:100vh;background:var(--panel);border-right:1px solid var(--border);padding:24px 14px;overflow-y:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:8px;margin-bottom:28px;padding:0 10px;}
  .sidebar-brand span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--text);}
  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:12.5px;margin-bottom:2px;}
  .sidebar-link i{font-size:17px;}
  .sidebar-link:hover{background:var(--panel-2);color:var(--text);}
  .sidebar-link.active{background:rgba(55,138,221,0.15);color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <div class="sidebar">
    <div class="sidebar-brand"><span>AgentPay</span></div>
    <a href="/" class="sidebar-link"><i class="ti ti-home"></i>Home</a>
    <a href="/how-it-works.html" class="sidebar-link"><i class="ti ti-list-numbers"></i>How it works</a>
    <a href="/security.html" class="sidebar-link"><i class="ti ti-shield-lock"></i>Security</a>
    <a href="/transactions.html" class="sidebar-link active"><i class="ti ti-list-details"></i>Transactions</a>
    <a href="/reputation.html" class="sidebar-link"><i class="ti ti-star"></i>Reputation</a>
    <a href="/faq.html" class="sidebar-link"><i class="ti ti-help-circle"></i>FAQ</a>
    <a href="/compare.html" class="sidebar-link"><i class="ti ti-scale"></i>Compare</a>
  </div>

  <div class="eyebrow">FULL SETTLEMENT HISTORY</div>
  <h1>Transactions</h1>
  <p class="sub">Every job ever settled by this agent, released or refunded, stored persistently and mirrored here.</p>

  <div id="txContainer"><div class="empty">Loading...</div></div>
</div>

<script>
async function loadTransactions() {
  const container = document.getElementById('txContainer');
  try {
    const res = await fetch('/transactions');
    const rows = await res.json();
    if (!rows.length) {
      container.innerHTML = '<div class="empty">No transactions yet. Run a job on the homepage to see it here.</div>';
      return;
    }
    container.innerHTML = `
      <table>
        <thead><tr><th>Time</th><th>Status</th><th>Task</th><th>Amount</th><th>Explorer</th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const isNanopay = r.jobId && r.jobId.startsWith('0xnano');
            const label = isNanopay
              ? '<span style="color:var(--blue);">⚡ Nanopayment (priority access)</span>'
              : ((r.taskResult && r.taskResult.result) ? r.taskResult.result.slice(0, 80) : (r.taskInput || '').slice(0, 80));
            const explorerCell = r.txHash
              ? `<a href="https://testnet.arcscan.app/tx/${r.txHash}" target="_blank" rel="noopener" style="color:var(--blue);">View ↗</a>`
              : (isNanopay
                  ? '<span style="color:var(--muted);" title="Nanopayments settle offchain instantly, then batch onchain later">Batched offchain</span>'
                  : '<span style="color:var(--muted);">pending</span>');
            return `
            <tr>
              <td>${new Date(r.createdAt).toLocaleString()}</td>
              <td><span class="status-pill ${r.status}">${r.status}</span></td>
              <td>${label}</td>
              <td>${r.amount} USDC</td>
              <td>${explorerCell}</td>
            </tr>
          `;
          }).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    container.innerHTML = '<div class="empty">Could not load transactions.</div>';
  }
}
loadTransactions();
</script>
</body>
</html>
